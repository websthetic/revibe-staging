{# Slim bar for pages without the main nav (chrome: "minimal" in front matter): logo, phone and a link home. #}

    <div class="cs-links">
        <a href="tel:{{ clinics[0].phoneForTel }}" class="cs-pill">{{ clinics[0].phone }}</a>

    </div>
</header>
