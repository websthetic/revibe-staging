{% for area in hurtAreas %}
<a class="cs-spot-link" href="{{ area.url }}" tabindex="-1">

<circle class="cs-ring" cx="{{ area.x }}" cy="{{ area.y }}" r="10"/>
<circle class="cs-dot" cx="{{ area.x }}" cy="{{ area.y }}" r="9"/>
